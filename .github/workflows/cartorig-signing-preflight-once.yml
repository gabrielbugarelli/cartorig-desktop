name: CartoRig Windows Authenticode One-Time Preflight
on:
  push:
    branches:
      - feature/ui-ux-stage24
    paths:
      - '.github/workflows/cartorig-signing-preflight-once.yml'
permissions:
  contents: read
jobs:
  preflight:
    if: "${{ github.event.repository.private == false && github.event.head_commit.message == 'ci(security): one-time Windows signature preflight' }}"
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check signature publishing contracts
        shell: pwsh
        run: |
          node tests/test_windows_signing_policy.mjs
          if($LASTEXITCODE -ne 0){throw 'Code-signing pipeline policy failed'}
      - name: Parse PowerShell and prove invalid signatures are rejected
        shell: pwsh
        run: |
          $errors=$null; $tokens=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/verify-windows-signature.ps1').Path,
            [ref]$tokens,[ref]$errors
          )
          if($errors.Count){throw ($errors | Out-String)}
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/unsigned-fixture.exe -Value 'MZ not signed' -Encoding ascii
          $failed=$false
          try {
            ./scripts/verify-windows-signature.ps1 -ExePath dist/unsigned-fixture.exe
          } catch {
            $failed=$true
            Write-Host ('Unsigned test executable rejected: '+$_.Exception.Message)
          }
          if(-not $failed){throw 'CRITICAL: unsigned EXE unexpectedly accepted as signed'}
          Write-Host 'Windows signature preflight PASS: unsigned builds rejected'
