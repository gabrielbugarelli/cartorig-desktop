name: CartoRig Windows Signing Tools Final Preflight
on:
  push:
    branches:
      - feature/ui-ux-stage24
    paths:
      - '.github/workflows/cartorig-signing-preflight-once.yml'
permissions:
  contents: read
jobs:
  preflight:
    if: "${{ github.event.repository.private == false && github.event.head_commit.message == 'ci(security): final signing tools preflight' }}"
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test signer policy and verify code syntax
        shell: pwsh
        run: |
          node tests/test_windows_signing_policy.mjs
          if($LASTEXITCODE -ne 0){throw 'Signing security policy failed'}
          foreach($path in @('scripts/verify-windows-signature.ps1','scripts/sign-windows-portable.ps1')){
            $tokens=$null;$errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "$path $($errors | Out-String)"}
            Write-Host "PowerShell parser PASS $path"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/not-signed.exe -Value 'MZ fixture' -Encoding ascii
          $rejected=$false
          try { ./scripts/verify-windows-signature.ps1 -ExePath dist/not-signed.exe }
          catch { $rejected=$true; Write-Host "Unsigned file rejected: $_" }
          if(-not $rejected){throw 'Unsigned EXE must fail closed'}
