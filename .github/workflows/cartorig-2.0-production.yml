name: CartoRig 2.0.4 Production Windows native acceptance
on:
  workflow_dispatch:
  push:
    tags: [ 'v2.0.*' ]
permissions:
  contents: read
jobs:
  windows-production:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python browser dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install chromium
      - name: Native Windows acceptance and fullgeo build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CartoRig-2.0.4-Windows-Native-Production
          path: |
            dist/CartoRig-2.0.4-Setup-Windows-x64.exe
            dist/CartoRig-2.0.4-Portable-Windows-x64.exe
          if-no-files-found: error
