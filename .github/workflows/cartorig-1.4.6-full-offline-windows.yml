name: CartoRig 1.4.6 - Full Offline Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.4.6*'

permissions:
  contents: read

jobs:
  release:
    name: Verify real Natural Earth 10m + Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout CartoRig source
        uses: actions/checkout@v4
      - name: Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install chromium
      - name: Download, pin, verify, compile and execute full Windows acceptance
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
      - name: Upload complete offline 1.4.6 release and QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-1.4.6-Windows-x64-Full-Offline-Verified
          path: |
            dist/CartoRig-1.4.6-Setup-Windows-x64.exe
            dist/CartoRig-1.4.6-Portable-Windows-x64.exe
            dist/CartoRig-1.4.6-Source-Complete-Offline.zip
            dist/CartoRig-1.4.6-Release-Checksums.json
            dist/SHA256SUMS.txt
            dist/tests/*
          retention-days: 30
          if-no-files-found: error
      - name: Upload incomplete-build diagnostic only if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-1.4.6-Failed-Build-Evidence-Not-A-Release
          path: |
            assets/geodata/offline_integrity.json
            dist/tests/*
          if-no-files-found: ignore
