name: CartoRig v2.2.0 One-time GitHub Release
# Public/free Windows release publish job. Remove after verifying assets and tag.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cartorig-release-v2.2.0-once.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: cartorig-release-v2.2.0
  cancel-in-progress: false
jobs:
  publish:
    if: "${{ github.event.repository.private == false && github.event.head_commit.message == 'ci(release): publish CartoRig v2.2.0 once' }}"
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout validated release notes
        uses: actions/checkout@v4
      - name: Verify tested Windows executable and publish official release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.before }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='v2.2.0'
          $qaRun=45310199870
          $qaSha='2508b25cade06e96e83372babbc3c9c99c17ce85'
          $qaArtifact='CartoRig-v2.2.0-Release-Candidate-Portable-Windows-x64'
          $approvedMerge='63eefff62f643cdf8b37ef56eea98a468f1536e0'
          $expectedExeSHA256='8438e5d12617b4df1a402d7aebfa02cb3b663c75d301416cbe2ee3699c6f83e3'
          if($env:RELEASE_TARGET -ne $approvedMerge){throw 'Refusing to tag unexpected main commit'}
          if(!(Test-Path 'docs/releases/v2.2.0.md')){throw 'Approved release notes missing'}
          $run=gh run view $qaRun --repo $repo --json conclusion,headSha | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.headSha -ne $qaSha){
            throw 'Windows QA did not complete successfully at expected source revision'
          }
          New-Item -ItemType Directory -Force release-input,release-output | Out-Null
          gh run download $qaRun --repo $repo --name $qaArtifact --dir release-input
          if($LASTEXITCODE -ne 0){throw 'Cannot download approved v2.2.0 Windows artifact'}
          $exeName='CartoRig-2.2.0-Wails3-Portable-Windows-x64.exe'
          $exe=Get-ChildItem release-input -File -Filter $exeName -Recurse | Select-Object -First 1
          $checksum=Get-ChildItem release-input -File -Filter '*SHA256*' -Recurse | Select-Object -First 1
          if(!$exe -or !$checksum -or $exe.Length -lt 5MB){throw 'Approved executable or checksum missing'}
          $expected=(Get-Content -Raw $checksum.FullName).Trim().Split(' ')[0].ToLowerInvariant()
          $actual=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($expected -ne $actual -or $actual -ne $expectedExeSHA256){throw 'Windows executable SHA-256 mismatch'}
          $releaseExe='release-output/'+$exeName
          $releaseSha='release-output/CartoRig-2.2.0-Windows-x64-SHA256.txt'
          $releaseZip='release-output/CartoRig-2.2.0-Windows-x64-Portable.zip'
          Copy-Item $exe.FullName $releaseExe
          Copy-Item $checksum.FullName $releaseSha
          Compress-Archive -Path $releaseExe,$releaseSha -DestinationPath $releaseZip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $archive=[System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $releaseZip).Path)
          try {
            if($archive.Entries.Count -ne 2){throw 'Release portable ZIP must include EXE and SHA256'}
            $names=@($archive.Entries | ForEach-Object Name)
            if($exeName -notin $names -or 'CartoRig-2.2.0-Windows-x64-SHA256.txt' -notin $names){
              throw 'Release ZIP content names are incorrect'
            }
          } finally { $archive.Dispose() }
          $existing=gh release view $tag --repo $repo --json tagName 2>$null
          if($LASTEXITCODE -eq 0){throw 'Release tag already exists; refusing to overwrite'}
          gh release create $tag $releaseZip $releaseExe $releaseSha --repo $repo --target $approvedMerge --title 'CartoRig Desktop v2.2.0 — UI/UX Etapas 2.1 e 2.2' --notes-file docs/releases/v2.2.0.md --latest
          if($LASTEXITCODE -ne 0){throw 'Failed to publish official GitHub release'}
          $published=gh release view $tag --repo $repo --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.isPrerelease -or $published.assets.Count -ne 3){
            throw 'Published stable release validation failed'
          }
          Write-Host "Release created: $tag"
          Write-Host "Release target: $approvedMerge"
          Write-Host "Executable SHA-256: $actual"
          Write-Host "Release assets count: $($published.assets.Count)"
