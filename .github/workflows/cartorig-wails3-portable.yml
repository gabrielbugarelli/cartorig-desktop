name: CartoRig Wails 3 Portable (Windows x64)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/wails3-desktop-portable
    paths:
      - 'main_wails.go'
      - 'desktop_http.go'
      - 'assets/**'
      - 'go.desktop.mod'
      - 'scripts/build-wails3-portable.ps1'
      - '.github/workflows/cartorig-wails3-portable.yml'
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/build-wails3-portable.ps1
      - name: Smoke test GUI launch on Windows runner
        id: smoke
        continue-on-error: true
        shell: pwsh
        env:
          CARTORIG_NO_GUI_ERRORS: '1'
        run: |
          $exe = (Resolve-Path 'dist/CartoRig-2.1.0-Wails3-Portable-Windows-x64.exe').Path
          & $exe --self-check
          $logPath = Join-Path $env:LOCALAPPDATA 'CartoRig/logs/desktop-startup.log'
          if (Test-Path $logPath) { Get-Content $logPath -Tail 12 }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) {
            Write-Host "GUI process exited during smoke test with code $($proc.ExitCode)"
            if (Test-Path $logPath) { Get-Content $logPath -Tail 60 }
            throw "GUI process terminated immediately in hosted runner"
          }
          Write-Host "GUI process remained running after 8 seconds"
          Stop-Process -Id $proc.Id -Force
      - name: Upload Windows startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-2.1.0-Wails3-Windows-Smoke-Log
          path: ~/AppData/Local/CartoRig/logs/desktop-startup.log
          if-no-files-found: ignore
      - name: Upload portable EXE and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-2.1.0-Wails3-Portable-Windows-x64
          path: |
            dist/CartoRig-2.1.0-Wails3-Portable-Windows-x64.exe
            dist/CartoRig-Wails3-SHA256.txt
          if-no-files-found: error
          retention-days: 30
