name: CartoRig Wails 3 Portable (Windows x64)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/wails3-desktop-portable
    paths:
      - 'main_wails.go'
      - 'desktop_http.go'
      - 'assets/**'
      - 'go.desktop.mod'
      - 'scripts/build-wails3-portable.ps1'
      - '.github/workflows/cartorig-wails3-portable.yml'
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/build-wails3-portable.ps1
      - name: Upload portable EXE and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-2.1.0-Wails3-Portable-Windows-x64
          path: |
            dist/CartoRig-2.1.0-Wails3-Portable-Windows-x64.exe
            dist/CartoRig-Wails3-SHA256.txt
          if-no-files-found: error
          retention-days: 30
