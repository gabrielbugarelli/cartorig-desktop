name: CartoRig 2.4.0 Preview Installed Windows QA (One-time)
# One-shot build on a public repo and standard windows-2022 runner.
# Reuse the previously approved portable EXE; do not silently replace it.
on:
  push:
    branches:
      - feature/ui-ux-stage24
    paths:
      - '.github/workflows/cartorig-stage24-installer-once.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: cartorig-2.4.0-installer-qa
  cancel-in-progress: false
jobs:
  installer:
    if: "${{ github.event.repository.private == false && github.event.head_commit.message == 'ci(installer): one-time installed Windows QA' }}"
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify installer security and packaging contract
        shell: pwsh
        run: |
          node tests/test_windows_installer.mjs
          if($LASTEXITCODE -ne 0){throw 'Installer packaging contract failed'}
          node tests/test_windows_signing_policy.mjs
          if($LASTEXITCODE -ne 0){throw 'Signing safety contract failed'}
          node tests/test_ui_stage23_drawing.mjs
          if($LASTEXITCODE -ne 0){throw 'Stage 2.3 drawing regression failed'}
          node tests/test_ui_stage24_looks.mjs
          if($LASTEXITCODE -ne 0){throw 'Stage 2.4 Looks regression failed'}
          foreach($path in @('scripts/build-windows-installer.ps1','scripts/test-windows-installer.ps1')){
            $tokens=$null;$errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "$path $($errors | Out-String)"}
          }
      - name: Download source executable from successful 2.4.0 QA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $qa=45314770326
          $approvedSha='008ae63064d24602c8c9532629173e1f6dac795e'
          $exeSha='89714c33f271cacc2a2c53bc9cfc338aff331f55d747d0925dfde838412bcd50'
          $artifact='CartoRig-2.4.0-Preview-Looks-Portable-Windows-x64'
          $r=gh run view $qa --repo $env:GITHUB_REPOSITORY --json conclusion,headSha | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $r.conclusion -ne 'success' -or $r.headSha -ne $approvedSha){
            throw 'Approved Stage 2.4 QA build was not successful or source revision differs'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          gh run download $qa --repo $env:GITHUB_REPOSITORY --name $artifact --dir dist
          if($LASTEXITCODE -ne 0){throw 'Cannot retrieve approved portable from GitHub Actions'}
          $exe='dist/CartoRig-2.4.0-Preview-Wails3-Portable-Windows-x64.exe'
          if(!(Test-Path $exe)){throw 'Approved EXE missing from QA artifact'}
          $actual=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum=(Get-Content -Raw 'dist/CartoRig-Wails3-SHA256.txt').Trim().Split(' ')[0].ToLowerInvariant()
          if($actual -ne $exeSha -or $checksum -ne $exeSha){throw 'Original executable SHA256 does not match approved release'}
          Write-Host "APPROVED EXE SHA256: $actual"
      - name: Ensure Inno Setup 6 compiler is available
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $iscc=@(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object {Test-Path -LiteralPath $_}
          if(!$iscc){
            choco install innosetup --version=6.7.1 --yes --no-progress
            if($LASTEXITCODE -ne 0){throw 'Could not install Inno Setup 6 compiler'}
          }
      - name: Compile traditional Windows installer
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 -ExpectedSHA256 '89714c33f271cacc2a2c53bc9cfc338aff331f55d747d0925dfde838412bcd50'
      - name: Real install + launch + uninstall on Windows
        shell: pwsh
        run: |
          ./scripts/test-windows-installer.ps1 -SetupExe 'dist/installer/CartoRig-2.4.0-Preview-Setup-Windows-x64.exe' -ApprovedPortableSHA256 '89714c33f271cacc2a2c53bc9cfc338aff331f55d747d0925dfde838412bcd50'
      - name: Publish validated UNsigned installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-2.4.0-Preview-Setup-Installer-Windows-x64
          path: |
            dist/installer/CartoRig-2.4.0-Preview-Setup-Windows-x64.exe
            dist/installer/CartoRig-2.4.0-Preview-Setup-Windows-x64-SHA256.txt
          if-no-files-found: error
          retention-days: 3
