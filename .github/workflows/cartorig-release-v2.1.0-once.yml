name: CartoRig v2.1.0 One-time GitHub Release
# Public repository standard runner only. Temporary QA publication workflow:
# delete after the release is published and verified.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cartorig-release-v2.1.0-once.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: cartorig-release-v2.1.0
  cancel-in-progress: false
jobs:
  publish:
    if: "${{ github.event.repository.private == false && github.event.head_commit.message == 'ci(release): publish v2.1.0 once' }}"
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout release notes and merged code
        uses: actions/checkout@v4
      - name: Verify approved build and publish portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.before }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $approvedRun=44428379757
          $approvedArtifact='CartoRig-2.1.0-Texturas-Terra-Mar-Checkboxes-Portable-Windows-x64'
          $releaseTag='v2.1.0'
          if($env:RELEASE_TARGET -notmatch '^[0-9a-f]{40}$'){throw 'Invalid merge commit for release target'}
          if($env:RELEASE_TARGET -ne 'b28a568d6429ea952466d8711d0ad434e36ef266'){throw 'Unexpected release commit; refusing to tag'}
          $runInfo=gh run view $approvedRun --repo $repo --json conclusion,headSha | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $runInfo.conclusion -ne 'success' -or $runInfo.headSha -ne 'c76f5f51b18fed1e1bcbca90f3ea844b251b6757'){
            throw 'Approved Windows source run mismatch'
          }
          New-Item -ItemType Directory -Force release-input,release-output | Out-Null
          gh run download $approvedRun --repo $repo --name $approvedArtifact --dir release-input
          if($LASTEXITCODE -ne 0){throw 'Cannot download approved portable artifact'}
          $exe=Get-ChildItem release-input -Filter '*.exe' -Recurse | Select-Object -First 1
          $sha=Get-ChildItem release-input -Filter '*SHA256*' -Recurse | Select-Object -First 1
          if(!$exe -or !$sha -or $exe.Length -lt 5MB){throw 'Portable executable or checksum missing'}
          $expected=(Get-Content -Raw $sha.FullName).Trim().Split(' ')[0].ToLowerInvariant()
          $actual=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($expected -ne $actual){throw 'Portable SHA256 mismatch'}
          $zip='release-output/CartoRig-2.1.0-Windows-x64-Portable.zip'
          Compress-Archive -Path $exe.FullName,$sha.FullName -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $archive=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try{
            if($archive.Entries.Count -ne 2){throw 'ZIP must include executable and checksum'}
            if(-not ($archive.Entries | Where-Object Name -eq $exe.Name)){throw 'EXE not in ZIP'}
          } finally {$archive.Dispose()}
          Copy-Item $sha.FullName 'release-output/CartoRig-2.1.0-Windows-x64-SHA256.txt'
          $exists=gh release view $releaseTag --repo $repo --json tagName 2>$null
          if($LASTEXITCODE -eq 0){throw 'Tag release already exists; refusing overwrite'}
          gh release create $releaseTag $zip 'release-output/CartoRig-2.1.0-Windows-x64-SHA256.txt' --repo $repo --target $env:RELEASE_TARGET --title 'CartoRig Desktop v2.1.0 - UI/UX Etapa 1' --notes-file docs/releases/v2.1.0.md --latest
          if($LASTEXITCODE -ne 0){throw 'GitHub Release creation failed'}
          $published=gh release view $releaseTag --repo $repo --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.isPrerelease -or $published.assets.Count -lt 2){throw 'Published Release verification failed'}
          Write-Host "Published $releaseTag at $env:RELEASE_TARGET"
          Write-Host "EXE SHA256: $actual"
          Write-Host "Release assets: $($published.assets.Count)"
